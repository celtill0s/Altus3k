services:
  app:
    build: .
    restart: unless-stopped
    volumes:
      - ./data:/data
    # Mentions légales de l'instance (page /legal), toutes facultatives : à renseigner dans un
    # fichier .env à côté de ce fichier (jamais commité). Voir docs/auto-hebergement.md.
    environment:
      - ALTUS_LEGAL_EDITOR=${ALTUS_LEGAL_EDITOR:-}
      - ALTUS_LEGAL_CONTACT=${ALTUS_LEGAL_CONTACT:-}
      - ALTUS_LEGAL_HOST=${ALTUS_LEGAL_HOST:-}
      - ALTUS_LEGAL_RELAY=${ALTUS_LEGAL_RELAY:-}
    # Journaux limités en taille (ils contiennent des adresses IP) : écrasés au fil de l'eau.
    logging: &logging
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    expose:
      - "8000"
    # Conteneur verrouillé : système de fichiers en lecture seule (sauf data/ et /tmp), aucun
    # privilège Linux, pas d'élévation possible. Une éventuelle faille ne pourrait ni modifier le
    # code ni sortir de data/.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging: *logging
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "127.0.0.1:8087:8080"

volumes:
  caddy_data:
  caddy_config:
